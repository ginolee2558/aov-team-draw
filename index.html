<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>傳說對決 7人戰隊分路抽取系統 - Bo7 冠軍賽模式</title>
<style>
  :root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --accent-blue: #1f6feb;
    --accent-gold: #f1e05a;
    --accent-red: #da3633;
    --accent-green: #238636;
    --border-color: #30363d;
  }
  body {
    margin: 0;
    background: var(--bg-color);
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app-container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    padding: 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 1.35rem; margin: 6px 0; color: #58a6ff; text-align: center; }
  .subtitle { font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; text-align: center; }

  /* Bo7 比分面板 */
  .bo7-scoreboard {
    width: 100%;
    background: linear-gradient(180deg, #1f242c, #161b22);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-sizing: border-box;
  }
  .team-box { text-align: center; flex: 1; }
  .team-name { font-size: 0.8rem; color: #8b949e; font-weight: bold; }
  .team-score { font-size: 1.8rem; font-weight: 900; }
  .score-blue { color: #58a6ff; }
  .score-red { color: #f85149; }
  .vs-badge {
    background: #21262d;
    border: 1px solid var(--border-color);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
    color: var(--accent-gold);
  }

  .status-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #21262d;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 0.82rem;
    box-sizing: border-box;
    border: 1px solid var(--border-color);
  }
  .reroll-tag {
    color: var(--accent-gold);
    font-weight: bold;
  }

  /* 當前抽取卡片 */
  .current-draw-card {
    width: 100%;
    background: linear-gradient(145deg, #1c2128, #161b22);
    border: 2px solid #58a6ff;
    border-radius: 12px;
    padding: 18px 16px;
    box-sizing: border-box;
    margin-bottom: 16px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(31, 111, 235, 0.2);
  }
  .current-title { font-size: 0.85rem; color: #8b949e; margin-bottom: 6px; }
  .current-player { font-size: 1.35rem; font-weight: bold; color: #f0f6fc; margin: 4px 0; }
  .current-hero { font-size: 1.6rem; font-weight: bold; color: var(--accent-gold); margin: 6px 0; }
  .current-meta { font-size: 0.9rem; color: #58a6ff; margin-top: 4px; }

  /* 提示標籤 */
  .bp-banner {
    width: 100%;
    padding: 6px 10px;
    background: rgba(241, 224, 90, 0.1);
    border: 1px solid rgba(241, 224, 90, 0.3);
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 0.78rem;
    color: var(--accent-gold);
    box-sizing: border-box;
    text-align: center;
  }

  .control-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  button {
    font-family: inherit;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-main {
    width: 100%;
    padding: 14px;
    background: var(--accent-blue);
    color: #fff;
    font-size: 1.05rem;
    box-shadow: 0 4px 12px rgba(31, 111, 235, 0.4);
  }
  .btn-confirm {
    flex: 1.3;
    padding: 12px;
    background: var(--accent-green);
    color: #fff;
    font-size: 0.95rem;
    box-shadow: 0 3px 10px rgba(35, 134, 54, 0.4);
  }
  .btn-reroll {
    flex: 1;
    padding: 12px;
    background: #30363d;
    color: var(--accent-gold);
    font-size: 0.82rem;
    border: 1px solid #484f58;
  }
  button:disabled {
    background: #21262d !important;
    color: #484f58 !important;
    border-color: #30363d !important;
    box-shadow: none !important;
    cursor: not-allowed;
  }

  .roster-title {
    width: 100%;
    font-size: 0.9rem;
    color: #8b949e;
    margin-bottom: 8px;
    text-align: left;
    font-weight: bold;
  }
  .slot-grid {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .slot-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .slot-card.locked {
    border-color: #238636;
    background: #101914;
  }
  .slot-label { font-size: 0.85rem; color: #8b949e; }
  .slot-val { font-size: 1.05rem; font-weight: bold; color: #f0f6fc; margin-top: 2px; }

  /* 彈窗 */
  .result-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 999;
  }
  canvas { width: 100%; max-width: 360px; border-radius: 12px; margin-bottom: 12px; }
  .modal-btn {
    background: #238636;
    color: #fff;
    padding: 11px 26px;
    border: none;
    border-radius: 20px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>🏆 傳說對決 職業冠軍賽 (Bo7)</h1>
  <div class="subtitle">全局 BP 模式 (角色用過即鎖 · 第七場巔峰對決)</div>

  <!-- 比分看板 -->
  <div class="bo7-scoreboard">
    <div class="team-box">
      <div class="team-name">我方戰隊 (YOU)</div>
      <div class="team-score score-blue" id="blueScore">0</div>
    </div>
    <div class="vs-badge" id="matchRoundBadge">Game 1 / Bo7</div>
    <div class="team-box">
      <div class="team-name">對手戰隊 (OPP)</div>
      <div class="team-score score-red" id="redScore">0</div>
    </div>
  </div>

  <div class="bp-banner" id="bpInfoBanner">
    🛡️ 全局 BP 生效中：已使用 0 隻英雄（第七局將解禁）
  </div>

  <div class="status-bar">
    <span>已鎖定：<strong id="stepIndicator">0 / 5</strong></span>
    <span>
      英雄重置：<span class="reroll-tag" id="rerollHeroDisplay">2</span> 次 ｜ 
      玩家重置：<span class="reroll-tag" id="rerollPlayerDisplay">2</span> 次
    </span>
  </div>

  <div class="current-draw-card" id="drawCard">
    <div class="current-title" id="cardPrompt">點擊下方按鈕開始抽取第 1 個位置</div>
    <div class="current-player" id="cardPlayer">─</div>
    <div class="current-hero" id="cardHero">等待抽籤</div>
    <div class="current-meta" id="cardMeta">尚未指定分路</div>
  </div>

  <div class="control-section">
    <button class="btn-main" id="startDrawBtn" onclick="handleStartDraw()">🎰 抽取新組合 (玩家 + 英雄)</button>

    <div class="btn-row" id="decisionRow" style="display: none;">
      <button class="btn-confirm" id="confirmBtn" onclick="handleConfirmPick()">✅ 確認鎖定</button>
      <button class="btn-reroll" id="rerollHeroBtn" onclick="handleRerollHero()">🎲 重抽英雄 (2)</button>
      <button class="btn-reroll" id="rerollPlayerBtn" onclick="handleRerollPlayer()">🎲 重抽玩家 (2)</button>
    </div>
  </div>

  <div class="roster-title">📋 本局先發五人名單</div>
  <div class="slot-grid">
    <div class="slot-card" id="slot-凱薩路">
      <div>
        <div class="slot-label">🛡️ 凱薩路 (DS Lane)</div>
        <div class="slot-val" id="val-凱薩路">未指派</div>
      </div>
    </div>
    <div class="slot-card" id="slot-打野">
      <div>
        <div class="slot-label">🌲 打野位 (Jungle)</div>
        <div class="slot-val" id="val-打野">未指派</div>
      </div>
    </div>
    <div class="slot-card" id="slot-中路">
      <div>
        <div class="slot-label">🧙 中路法師 (Mid Lane)</div>
        <div class="slot-val" id="val-中路">未指派</div>
      </div>
    </div>
    <div class="slot-card" id="slot-魔龍路">
      <div>
        <div class="slot-label">🏹 魔龍輸出 (Abyssal Lane)</div>
        <div class="slot-val" id="val-魔龍路">未指派</div>
      </div>
    </div>
    <div class="slot-card" id="slot-輔助">
      <div>
        <div class="slot-label">🤝 遊走輔助 (Support)</div>
        <div class="slot-val" id="val-輔助">未指派</div>
      </div>
    </div>
  </div>
</div>

<div class="result-modal" id="resultModal">
  <canvas id="posterCanvas" width="720" height="1060"></canvas>
  <button class="modal-btn" id="modalActionBtn" onclick="handleModalNextAction()">下一場對決 ➔</button>
</div>

let drawnHeroesThisSlot = new Set();

let currentCandidate = null;
let savedRoster = [];

// DOM
const blueScoreEl = document.getElementById('blueScore');
const redScoreEl = document.getElementById('redScore');
const matchRoundBadge = document.getElementById('matchRoundBadge');
const bpInfoBanner = document.getElementById('bpInfoBanner');

const startDrawBtn = document.getElementById('startDrawBtn');
const decisionRow = document.getElementById('decisionRow');
const confirmBtn = document.getElementById('confirmBtn');
const rerollHeroBtn = document.getElementById('rerollHeroBtn');
const rerollPlayerBtn = document.getElementById('rerollPlayerBtn');
const rerollHeroDisplay = document.getElementById('rerollHeroDisplay');
const rerollPlayerDisplay = document.getElementById('rerollPlayerDisplay');
const stepIndicator = document.getElementById('stepIndicator');

const cardPrompt = document.getElementById('cardPrompt');
const cardPlayer = document.getElementById('cardPlayer');
const cardHero = document.getElementById('cardHero');
const cardMeta = document.getElementById('cardMeta');
const modalActionBtn = document.getElementById('modalActionBtn');

function initBo7Stats() {
  PLAYERS.forEach(p => {
    bo7PlayerRecords[p] = { mvpCount: 0, totalRating: 0, gamesPlayed: 0 };
  });
}
initBo7Stats();

function updateScoreboardUI() {
  blueScoreEl.innerText = blueWins;
  redScoreEl.innerText = redWins;
  matchRoundBadge.innerText = `Game ${currentGameRound} / Bo7`;

  if (currentGameRound === 7) {
    bpInfoBanner.innerText = "🔥 第七局【巔峰對決】！全局 BP 解禁，全英雄開放使用！";
    bpInfoBanner.style.borderColor = "rgba(248, 81, 73, 0.5)";
    bpInfoBanner.style.color = "#f85149";
  } else {
    bpInfoBanner.innerText = `🛡️ 全局 BP 生效中：已使用 ${globalBannedHeroes.size} 隻英雄（第七局解禁）`;
    bpInfoBanner.style.borderColor = "rgba(241, 224, 90, 0.3)";
    bpInfoBanner.style.color = "var(--accent-gold)";
  }
}

function getAvailableRoles() {
  const ALL_ROLES = ["凱薩路", "打野", "中路", "魔龍路", "輔助"];
  return ALL_ROLES.filter(r => !lockedRoles.has(r));
}

function getAvailableHeroes(excludeDrawnInSlot = false) {
  const availRoles = getAvailableRoles();
  return HEROES_DB.filter(h => {
    // 前六場已使用過且被全局封鎖的英雄排除（第七局巔峰對決不排除）
    if (currentGameRound < 7 && globalBannedHeroes.has(h.name)) return false;
    // 本場內已鎖定的排除
    if (lockedHeroes.has(h.name)) return false;
    // 本槽位已抽過排除
    if (excludeDrawnInSlot && drawnHeroesThisSlot.has(h.name)) return false;
    return h.roles.some(r => availRoles.includes(r));
  });
}

function getAvailablePlayers(excludeDrawnInSlot = false) {
  return PLAYERS.filter(p => {
    if (lockedPlayers.has(p)) return false;
    if (excludeDrawnInSlot && drawnPlayersThisSlot.has(p)) return false;
    return true;
  });
}

function resolveRoleForHero(hero) {
  const availRoles = getAvailableRoles();
  const matched = hero.roles.filter(r => availRoles.includes(r));
  return matched[Math.floor(Math.random() * matched.length)];
}

function renderCurrentCard() {
  if (!currentCandidate) return;
  const { player, hero, assignedRole } = currentCandidate;
  cardPlayer.innerText = `選手：${player}`;
  cardHero.innerText = hero.name;
  cardMeta.innerText = `出戰路線：【${assignedRole}】`;

  updateRerollButtons();
}

function updateRerollButtons() {
  rerollHeroDisplay.innerText = heroRerollsLeft;
  rerollPlayerDisplay.innerText = playerRerollsLeft;

  if (heroRerollsLeft > 0) {
    rerollHeroBtn.disabled = false;
    rerollHeroBtn.innerText = `🎲 重抽英雄 (${heroRerollsLeft})`;
  } else {
    rerollHeroBtn.disabled = true;
    rerollHeroBtn.innerText = `🎲 重抽英雄 (0)`;
  }

  if (playerRerollsLeft > 0) {
    rerollPlayerBtn.disabled = false;
    rerollPlayerBtn.innerText = `🎲 重抽玩家 (${playerRerollsLeft})`;
  } else {
    rerollPlayerBtn.disabled = true;
    rerollPlayerBtn.innerText = `🎲 重抽玩家 (0)`;
  }
}

// 1. 開始抽取
function handleStartDraw() {
  startDrawBtn.disabled = true;
  decisionRow.style.display = "none";
  cardPrompt.innerText = `Game ${currentGameRound} - 為第 ${lockedCount + 1} 個位置挑選選手與英雄…`;

  drawnPlayersThisSlot.clear();
  drawnHeroesThisSlot.clear();

  const availHeroes = getAvailableHeroes(false);
  const availPlayers = getAvailablePlayers(false);

  let count = 0;
  const timer = setInterval(() => {
    const tHero = availHeroes[Math.floor(Math.random() * availHeroes.length)];
    const tPlayer = availPlayers[Math.floor(Math.random() * availPlayers.length)];
    cardPlayer.innerText = `選手：${tPlayer}`;
    cardHero.innerText = tHero.name;
    cardMeta.innerText = `挑選中…`;
    count++;

    if (count > 10) {
      clearInterval(timer);
      const pickedHero = availHeroes[Math.floor(Math.random() * availHeroes.length)];
      const pickedPlayer = availPlayers[Math.floor(Math.random() * availPlayers.length)];
      
      drawnPlayersThisSlot.add(pickedPlayer);
      drawnHeroesThisSlot.add(pickedHero.name);

      setCandidate(pickedPlayer, pickedHero);

      cardPrompt.innerText = `請選擇鎖定或使用獨立重抽額度：`;
      decisionRow.style.display = "flex";
      confirmBtn.disabled = false;
    }
  }, 60);
}

function setCandidate(player, hero) {
  const assignedRole = resolveRoleForHero(hero);
  const pIndex = PLAYERS.indexOf(player);
  const prof = hero.p[pIndex];
  const finalScore = Math.round(hero.base * (0.65 + prof * 0.45));

  currentCandidate = { player, hero, assignedRole, prof, finalScore };
  renderCurrentCard();
}

// 2. 🎲 重抽英雄
function handleRerollHero() {
  if (heroRerollsLeft <= 0) return;
  heroRerollsLeft--;
  rerollHeroBtn.disabled = true;
  rerollPlayerBtn.disabled = true;
  confirmBtn.disabled = true;

  let availHeroes = getAvailableHeroes(true);
  if (availHeroes.length === 0) {
    availHeroes = getAvailableHeroes(false).filter(h => h.name !== currentCandidate.hero.name);
  }

  let count = 0;
  const timer = setInterval(() => {
    const tHero = availHeroes[Math.floor(Math.random() * availHeroes.length)];
    cardHero.innerText = tHero.name;
    count++;
    if (count > 8) {
      clearInterval(timer);
      const newHero = availHeroes[Math.floor(Math.random() * availHeroes.length)];
      drawnHeroesThisSlot.add(newHero.name);
      setCandidate(currentCandidate.player, newHero);
      confirmBtn.disabled = false;
    }
  }, 60);
}

// 3. 🎲 重抽玩家
function handleRerollPlayer() {
  if (playerRerollsLeft <= 0) return;
  playerRerollsLeft--;
  rerollHeroBtn.disabled = true;
  rerollPlayerBtn.disabled = true;
  confirmBtn.disabled = true;

  let availPlayers = getAvailablePlayers(true);
  if (availPlayers.length === 0) {
    availPlayers = getAvailablePlayers(false).filter(p => p !== currentCandidate.player);
  }

  let count = 0;
  const timer = setInterval(() => {
    const tPlayer = availPlayers[Math.floor(Math.random() * availPlayers.length)];
    cardPlayer.innerText = `選手：${tPlayer}`;
    count++;
    if (count > 8) {
      clearInterval(timer);
      const newPlayer = availPlayers[Math.floor(Math.random() * availPlayers.length)];
      drawnPlayersThisSlot.add(newPlayer);
      setCandidate(newPlayer, currentCandidate.hero);
      confirmBtn.disabled = false;
    }
  }, 60);
}

// 4. ✅ 確認鎖定
function handleConfirmPick() {
  const { player, hero, assignedRole } = currentCandidate;

  lockedPlayers.add(player);
  lockedHeroes.add(hero.name);
  lockedRoles.add(assignedRole);
  lockedCount++;
  savedRoster.push({ ...currentCandidate });

  const slotEl = document.getElementById(`slot-${assignedRole}`);
  const valEl = document.getElementById(`val-${assignedRole}`);

  slotEl.classList.add('locked');
  valEl.innerText = `${player} ─ ${hero.name}`;
  valEl.style.color = "#58a6ff";

  stepIndicator.innerText = `${lockedCount} / 5`;
  decisionRow.style.display = "none";

  if (lockedCount < 5) {
    cardPrompt.innerText = `第 ${lockedCount} 個位置已鎖定！請繼續抽取下個位置`;
    cardPlayer.innerText = `─`;
    cardHero.innerText = `待抽取…`;
    cardMeta.innerText = `剩餘可用路線：${getAvailableRoles().join('、')}`;

    startDrawBtn.disabled = false;
    startDrawBtn.innerText = `🎰 抽取第 ${lockedCount + 1} 個位置`;
  } else {
    cardPrompt.innerText = `Game ${currentGameRound} 先發五人集結完畢，準備迎戰！`;
    startDrawBtn.style.display = "block";
    startDrawBtn.disabled = false;
    startDrawBtn.innerText = `⚔️ 進行 Game ${currentGameRound} 排位對局結算`;
    startDrawBtn.onclick = generateMatchResultPoster;
  }
}

// 5. 實戰排位模擬
function simulateMatchStats(roster) {
  let totalScore = 0;
  let totalProf = 0;
  roster.forEach(r => {
    totalScore += r.finalScore;
    totalProf += r.prof;
  });
  const avgScore = totalScore / 5;
  const avgProf = totalProf / 5;

  const profFactor = (avgProf - 0.55) * 0.55;
  const scoreFactor = (avgScore - 84) * 0.035;
  let winRate = 0.46 + profFactor + scoreFactor;
  winRate = Math.min(0.92, Math.max(0.15, winRate));

  const isVictory = Math.random() < winRate;

  const teamKills = isVictory ? Math.floor(Math.random() * 9) + 17 : Math.floor(Math.random() * 9) + 7;
  const teamDeaths = isVictory ? Math.floor(Math.random() * 7) + 6 : Math.floor(Math.random() * 9) + 16;

  const roleWeights = {
    "打野": { k: 0.28, a: 0.18, d: 0.20 },
    "魔龍路": { k: 0.30, a: 0.16, d: 0.18 },
    "中路": { k: 0.20, a: 0.24, d: 0.19 },
    "凱薩路": { k: 0.16, a: 0.16, d: 0.22 },
    "輔助": { k: 0.06, a: 0.38, d: 0.21 }
  };

  let playerStats = roster.map(item => {
    const rw = roleWeights[item.assignedRole] || { k: 0.2, a: 0.2, d: 0.2 };
    const profBonus = (item.prof - 0.5); 

    let rawK = teamKills * rw.k * (1 + profBonus * 0.45) + (Math.random() * 1.6 - 0.8);
    let rawD = teamDeaths * rw.d * (1 - profBonus * 0.50) + (Math.random() * 1.4 - 0.7);
    let rawA = teamKills * rw.a * (1 + profBonus * 0.35) + (Math.random() * 2.0 - 1.0);

    let k = Math.max(0, Math.round(rawK));
    let d = Math.max(0, Math.round(rawD));
    let a = Math.max(0, Math.round(rawA));

    const effectiveDeath = Math.max(1, d);
    const rawRatio = (k * 3.0 + a * 1.8) / (effectiveDeath * 1.3);
    let calcRating = 4.2 + (rawRatio * 0.75) + (item.prof * 2.5);
    if (!isVictory) calcRating *= 0.88;

    calcRating = Math.min(14.5, Math.max(3.8, calcRating)).toFixed(1);

    return {
      ...item,
      k, d, a,
      kdaStr: `${k} / ${d} / ${a}`,
      rating: parseFloat(calcRating)
    };
  });

  let mvpIndex = 0;
  let maxRating = -1;
  playerStats.forEach((p, idx) => {
    if (p.rating > maxRating) {
      maxRating = p.rating;
      mvpIndex = idx;
    }
  });
  playerStats[mvpIndex].isMvp = true;

  return { isVictory, playerStats, teamKills, teamDeaths, mvpPlayer: playerStats[mvpIndex] };
}

// 6. 繪製單局戰報 / 冠軍海報
let lastMatchResult = null;

function generateMatchResultPoster() {
  const canvas = document.getElementById('posterCanvas');
  const ctx = canvas.getContext('2d');
  const modal = document.getElementById('resultModal');
  modal.style.display = 'flex';

  const simResult = simulateMatchStats(savedRoster);
  lastMatchResult = simResult;
  const { isVictory, playerStats, teamKills, teamDeaths, mvpPlayer } = simResult;

  // 更新比分與紀錄
  if (isVictory) {
    blueWins++;
    bo7PlayerRecords[mvpPlayer.player].mvpCount++;
  } else {
    redWins++;
  }

  // 記錄選手局均評分
  playerStats.forEach(p => {
    bo7PlayerRecords[p.player].totalRating += p.rating;
    bo7PlayerRecords[p.player].gamesPlayed += 1;
  });

  // 加入全局 BP（第七場不記錄）
  if (currentGameRound < 7) {
    savedRoster.forEach(r => globalBannedHeroes.add(r.hero.name));
  }

  updateScoreboardUI();

  // 判斷 Bo7 是否結束
  const isSeriesOver = (blueWins === 4 || redWins === 4);

  if (isSeriesOver) {
    if (blueWins === 4) {
      drawChampionshipPoster(ctx, true);
      modalActionBtn.innerText = "🏆 登頂奪冠！再戰新賽季 ↺";
      modalActionBtn.style.background = "#ffb800";
      modalActionBtn.style.color = "#000";
    } else {
      drawChampionshipPoster(ctx, false);
      modalActionBtn.innerText = "遺憾落敗，重新挑戰 Bo7 ↺";
      modalActionBtn.style.background = "#30363d";
      modalActionBtn.style.color = "#fff";
    }
  } else {
    drawSingleGamePoster(ctx, simResult);
    modalActionBtn.innerText = `進入 Game ${currentGameRound + 1} ➔`;
    modalActionBtn.style.background = "#238636";
    modalActionBtn.style.color = "#fff";
  }
}

// 繪製單局結算海報
function drawSingleGamePoster(ctx, simResult) {
  const { isVictory, playerStats, teamKills, teamDeaths } = simResult;

  ctx.fillStyle = "#0b0e14";
  ctx.fillRect(0, 0, 720, 1060);

  const bannerColor = isVictory ? "#238636" : "#da3633";
  ctx.fillStyle = bannerColor;
  ctx.fillRect(0, 0, 720, 150);

  ctx.fillStyle = "#ffffff";
  ctx.font = "900 64px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(isVictory ? `GAME ${currentGameRound} 獲勝` : `GAME ${currentGameRound} 告負`, 360, 95);

  ctx.font = "bold 20px sans-serif";
  ctx.fillStyle = isVictory ? "#a6e3a1" : "#f5c2e7";
  ctx.fillText(`當前系列賽總比分 【 ${blueWins} : ${redWins} 】 · 團隊人頭 ${teamKills} : ${teamDeaths}`, 360, 134);

  ctx.textAlign = "left";
  const startY = 175;
  const roleOrder = ["凱薩路", "打野", "中路", "魔龍路", "輔助"];
  const sortedStats = roleOrder.map(r => playerStats.find(p => p.assignedRole === r));

  sortedStats.forEach((p, idx) => {
    const y = startY + (idx * 152);

    ctx.fillStyle = "#161b22";
    ctx.roundRect(30, y, 660, 136, 14);
    ctx.fill();

    ctx.lineWidth = p.isMvp ? 3 : 1;
    ctx.strokeStyle = p.isMvp ? "#f1e05a" : "#30363d";
    ctx.stroke();

    ctx.fillStyle = "#58a6ff";
    ctx.font = "bold 23px sans-serif";
    ctx.fillText(`【${p.assignedRole}】`, 50, y + 42);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText(`${p.player} ─ ${p.hero.name}`, 160, y + 42);

    if (p.isMvp) {
      ctx.fillStyle = "#f1e05a";
      ctx.font = "900 22px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(isVictory ? "★ MVP" : "★ 敗方 MVP", 670, y + 42);
      ctx.textAlign = "left";
    }

    ctx.strokeStyle = "#21262d";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(50, y + 62);
    ctx.lineTo(670, y + 62);
    ctx.stroke();

    ctx.fillStyle = "#8b949e";
    ctx.font = "18px sans-serif";
    ctx.fillText("戰績 KDA", 60, y + 94);
    ctx.fillText("局內評分", 540, y + 94);

    ctx.fillStyle = "#f0f6fc";
    ctx.font = "900 25px sans-serif";
    ctx.fillText(p.kdaStr, 60, y + 124);

    ctx.fillStyle = p.isMvp ? "#f1e05a" : "#ffffff";
    ctx.font = "900 25px sans-serif";
    ctx.fillText(p.rating.toFixed(1), 540, y + 124);
  });

  ctx.textAlign = "center";
  ctx.fillStyle = "#8b949e";
  ctx.font = "17px sans-serif";
  ctx.fillText(`全局已封鎖 ${globalBannedHeroes.size} 隻英雄 ｜ 點擊下方按鈕繼續下一場`, 360, 995);
}

// 繪製 Bo7 系列賽最終頒獎海報（勝者頒發 FMVP，敗者不顯示）
function drawChampionshipPoster(ctx, isWinChampionship) {
  ctx.fillStyle = "#0b0e14";
  ctx.fillRect(0, 0, 720, 1060);

  if (isWinChampionship) {
    // 金色冠軍頂條
    ctx.fillStyle = "#ffb800";
    ctx.fillRect(0, 0, 720, 180);

    ctx.fillStyle = "#000000";
    ctx.font = "900 62px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CHAMPIONS", 360, 90);

    ctx.font = "bold 26px sans-serif";
    ctx.fillText(`🏆 2026 傳說對決 總冠軍 (${blueWins} : ${redWins})`, 360, 145);

    // 計算 FMVP：勝場 MVP 最多者；若同分則比較平均評分
    let fmvpPlayer = null;
    let maxMvpCount = -1;
    let maxAvgRating = -1;

    PLAYERS.forEach(p => {
      const rec = bo7PlayerRecords[p];
      const avg = rec.gamesPlayed > 0 ? (rec.totalRating / rec.gamesPlayed) : 0;
      if (rec.mvpCount > maxMvpCount || (rec.mvpCount === maxMvpCount && avg > maxAvgRating)) {
        maxMvpCount = rec.mvpCount;
        maxAvgRating = avg;
        fmvpPlayer = p;
      }
    });

    // FMVP 專屬榮譽大卡
    ctx.fillStyle = "#1c2128";
    ctx.roundRect(40, 220, 640, 260, 16);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#ffb800";
    ctx.stroke();

    ctx.fillStyle = "#ffb800";
    ctx.font = "900 32px sans-serif";
    ctx.fillText("👑 總決賽最有價值選手 (FMVP)", 360, 280);

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 66px sans-serif";
    ctx.fillText(fmvpPlayer, 360, 365);

    ctx.font = "bold 22px sans-serif";
    ctx.fillStyle = "#a6e3a1";
    ctx.fillText(`系列賽斬獲 ${maxMvpCount} 次單局 MVP ｜ 場均評分 ${maxAvgRating.toFixed(1)}`, 360, 420);

    // 系列賽英雄數據
    ctx.fillStyle = "#161b22";
    ctx.roundRect(40, 520, 640, 440, 16);
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#30363d";
    ctx.stroke();

    ctx.fillStyle = "#58a6ff";
    ctx.font = "bold 26px sans-serif";
    ctx.fillText("🎖️ 系列賽榮譽英雄池", 360, 570);

    ctx.fillStyle = "#c9d1d9";
    ctx.font = "20px sans-serif";
    ctx.fillText(`全隊通力合作鏖戰 ${currentGameRound} 局`, 360, 620);
    ctx.fillText(`深度英雄海：共解鎖征戰 ${globalBannedHeroes.size} 位不同英雄！`, 360, 660);

    // 列出部分代表性英雄
    const heroArray = Array.from(globalBannedHeroes).slice(0, 18);
    ctx.font = "18px sans-serif";
    ctx.fillStyle = "#ffb800";
    ctx.fillText(heroArray.slice(0, 6).join("  •  "), 360, 730);
    ctx.fillText(heroArray.slice(6, 12).join("  •  "), 360, 775);
    if (heroArray.length > 12) {
      ctx.fillText(heroArray.slice(12, 18).join("  •  "), 360, 820);
    }

    ctx.fillStyle = "#8b949e";
    ctx.font = "18px sans-serif";
    ctx.fillText("長按海報儲存榮譽冠軍戰報，分享奪冠時刻！", 360, 910);

  } else {
    // 遺憾落敗（不頒發 FMVP）
    ctx.fillStyle = "#da3633";
    ctx.fillRect(0, 0, 720, 180);

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 60px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("RUNNER-UP 亞軍", 360, 95);

    ctx.font = "bold 26px sans-serif";
    ctx.fillText(`總比分 【 ${blueWins} : ${redWins} 】 憾負對手`, 360, 145);

    ctx.fillStyle = "#161b22";
    ctx.roundRect(40, 240, 640, 660, 16);
    ctx.fill();

    ctx.fillStyle = "#f85149";
    ctx.font = "bold 30px sans-serif";
    ctx.fillText("遺憾止步總決賽舞台", 360, 360);

    ctx.fillStyle = "#c9d1d9";
    ctx.font = "22px sans-serif";
    ctx.fillText(`在 Bo7 的強烈爭奪中戰至第 ${currentGameRound} 局`, 360, 440);
    ctx.fillText("全局 BP 英雄池深度面臨考驗", 360, 490);
    ctx.fillText(`共動用了 ${globalBannedHeroes.size} 位英雄出戰`, 360, 540);

    ctx.fillStyle = "#8b949e";
    ctx.font = "20px sans-serif";
    ctx.fillText("勝敗乃兵家常事，重整旗鼓再來一局！", 360, 650);
  }
}

// 處理彈窗下一步按鈕
function handleModalNextAction() {
  const isSeriesOver = (blueWins === 4 || redWins === 4);
  document.getElementById('resultModal').style.display = 'none';

  if (isSeriesOver) {
    // 重新開始整個 Bo7
    resetEntireBo7();
  } else {
    // 進入下一小局
    currentGameRound++;
    setupNextGameRound();
  }
}

// 準備下一局
function setupNextGameRound() {
  heroRerollsLeft = 2;
  playerRerollsLeft = 2;
  lockedCount = 0;
  lockedPlayers.clear();
  lockedHeroes.clear();
  lockedRoles.clear();
  drawnPlayersThisSlot.clear();
  drawnHeroesThisSlot.clear();
  currentCandidate = null;
  savedRoster = [];

  stepIndicator.innerText = "0 / 5";
  updateScoreboardUI();

  cardPrompt.innerText = `Game ${currentGameRound} 開始！請抽取第 1 個位置`;
  cardPlayer.innerText = "─";
  cardHero.innerText = "等待抽籤";
  cardMeta.innerText = "尚未指定分路";

  decisionRow.style.display = "none";
  startDrawBtn.style.display = "block";
  startDrawBtn.disabled = false;
  startDrawBtn.innerText = `🎰 抽取 Game ${currentGameRound} 組合`;
  startDrawBtn.onclick = handleStartDraw;

  const ALL_ROLES = ["凱薩路", "打野", "中路", "魔龍路", "輔助"];
  ALL_ROLES.forEach(r => {
    const slotEl = document.getElementById(`slot-${r}`);
    slotEl.classList.remove('locked');
    document.getElementById(`val-${r}`).innerText = "未指派";
    document.getElementById(`val-${r}`).style.color = "#f0f6fc";
  });
}

// 重置整個 Bo7
function resetEntireBo7() {
  currentGameRound = 1;
  blueWins = 0;
  redWins = 0;
  globalBannedHeroes.clear();
  initBo7Stats();
  setupNextGameRound();
}
</script>
